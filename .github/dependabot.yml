version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Dependabot preserves full commit SHA pins and updates version comments.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "##build "
      prefix-development: "##build "
    labels:
      - buildsystem
