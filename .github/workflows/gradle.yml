# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Build Extension

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 2
      matrix:
        # Latest patch release for each supported Ghidra minor line.
        ghidra:
          - "12.1.4"
          - "12.0.4"
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Ghidra
      uses: antoniovazquezblanco/setup-ghidra@2bb30c438fe1e50617ff261ad6de159376970972 # v2.2.1
      with:
        version: ${{ matrix.ghidra }}

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: 'basic'
        gradle-version: '8.5'

    - name: Build with Gradle Wrapper
      run: gradle buildExtension
      working-directory: ./R4Ghidra

    - name: Test binary project compatibility
      run: python3 scripts/test-project.py

    - name: Test HTTP commands
      run: python3 scripts/test-http.py

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: R4Ghidra_Ghidra_${{ matrix.ghidra }}
        path: R4Ghidra/dist/*.zip

  documentation:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Ghidra (latest version only)
      uses: antoniovazquezblanco/setup-ghidra@2bb30c438fe1e50617ff261ad6de159376970972 # v2.2.1
      with:
        version: "12.1.4"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: 'basic'
        gradle-version: '8.5'

    - name: Generate Javadoc
      run: gradle javadoc
      working-directory: ./R4Ghidra

    - name: Create documentation archive
      run: |
        mkdir -p docs_archive
        cp -r build/docs/javadoc docs_archive/
        cd docs_archive
        zip -r ../R4Ghidra-javadoc.zip .
      working-directory: ./R4Ghidra

    - name: Upload documentation
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: R4Ghidra-javadoc
        path: R4Ghidra/R4Ghidra-javadoc.zip

  code-style:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run code style check
      run: make indent && git diff --exit-code

  release:
    runs-on: "ubuntu-latest"
    needs: [build, documentation, code-style]

    steps:
    - name: Download binaries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

    - name: Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          R4Ghidra_Ghidra_*/*.zip
          R4Ghidra-javadoc/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
